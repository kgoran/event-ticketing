# What the Scaling Lab may do in the product's namespace (D31, D39, SL3): read its pods and
# deployments, change a deployment's instance count, switch KEDA's autoscaling on and off (and its
# scale-down wait), read what the autoscaler measures, read the database's CloudNativePG cluster,
# and delete a pod, which the failover drill does to the primary; and read the nodes, for their
# zones. Nothing else: least privilege, as for any operator tool.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalinglab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalinglab
  namespace: {{ .Values.productNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalinglab
  namespace: {{ .Values.productNamespace }}
subjects:
  - kind: ServiceAccount
    name: scalinglab
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scalinglab
---
# Nodes are cluster-wide: reading them shows each database instance's zone (D47).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scalinglab-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scalinglab-nodes
subjects:
  - kind: ServiceAccount
    name: scalinglab
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scalinglab-nodes
