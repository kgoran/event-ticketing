# What the Scaling Lab may do in the product's namespace (D31, D39): read its pods and deployments,
# change a deployment's instance count, switch KEDA's autoscaling on and off (and its scale-down
# wait), and read what the autoscaler measures, nothing else. Least privilege, as for any operator tool.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalinglab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalinglab
  namespace: {{ .Values.productNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalinglab
  namespace: {{ .Values.productNamespace }}
subjects:
  - kind: ServiceAccount
    name: scalinglab
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scalinglab
