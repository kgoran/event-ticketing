name: tooling-ci

# Builds everything under tooling/. No path filters, for the same reason as product-ci.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: "tooling: build"
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Upgrade deliberately, in its own PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tooling/Tooling.slnx

      - name: Build
        run: dotnet build tooling/Tooling.slnx --no-restore -c Release

      # LocalPay's API document is the contract the product's adapter is written against.
      - name: OpenAPI documents are committed and current
        run: |
          changes="$(git status --porcelain -- ':(glob)tooling/**/openapi/*.json')"
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff -- ':(glob)tooling/**/openapi/*.json'
            echo "::error::The build changed or created OpenAPI documents. Build locally and commit tooling/**/openapi/*.json."
            exit 1
          fi

      - name: Test
        run: dotnet test --solution tooling/Tooling.slnx --no-build -c Release
