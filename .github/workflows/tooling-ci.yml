name: tooling-ci

# Builds everything under tooling/. No path filters, for the same reason as product-ci.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: "tooling: build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tooling/Tooling.slnx

      - name: Build
        run: dotnet build tooling/Tooling.slnx --no-restore -c Release

      # A test step joins here with the first tooling test project (LocalPay, backlog item L1).
