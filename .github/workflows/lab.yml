name: lab

# The whole system in a kind cluster, as `dotnet run lab.cs -- up` builds it on a laptop (D34):
# on pull requests that change how it is deployed, nightly, and on demand. Not a required check,
# so path filters are safe here (see product-ci for why required checks have none).
on:
  pull_request:
    paths:
      - lab.cs
      - platform/**
      - product/deploy/**
      - tooling/deploy/**
      - dev/AppHost/Realms/**
      - tooling/tests/Lab.SystemTests/**
      - tooling/checks/**
      - .github/workflows/lab.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lab:
    name: "lab: up and check"
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Upgrade deliberately, in its own PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Cluster, platform, nine images from this commit, product, tooling and the demo data.
      - name: Up
        run: dotnet run lab.cs -- up

      # Every host ready, every address answering, sign-in, the demo, a burst of load.
      - name: Check
        run: dotnet run lab.cs -- check

      # DP4: `up` has just put the demo on sale, so its rush is on and a release must be refused.
      - name: Deploy gate refuses during an on-sale
        run: |
          set +e
          dotnet run lab.cs -- deploy 2>&1 | tee gate.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "2" ] || ! grep -q "Refused:" gate.log; then
            echo "::error::The deploy gate let a release through during an on-sale (exit code $code)."
            exit 1
          fi

      # T10 (DP2): every host rolled out again under constant load; fails above 0.1% failed requests.
      # Past the gate on purpose, as an emergency release would be.
      - name: Deploy under load
        run: |
          dotnet run lab.cs -- deploy --restart --load 50 --during-on-sale "lab workflow: measuring T10"

      # Q7: the M2 demo's other steps as a dry run (docs/demos/m2.md): a purchase in the cluster,
      # scaling by hand and with Auto, a flag switched without a deploy; none may fail a request.
      - name: M2 demo dry run
        env:
          LAB_SYSTEM_TESTS: "1"
        run: dotnet test --project tooling/tests/Lab.SystemTests

      # T2 (D58): after everything above, purchases, scaling and a rollout, every invariant still holds.
      - name: Invariants
        run: dotnet run lab.cs -- check --invariants

      # The definition of done: `reset` in under 3 minutes (a slower runner gets a warning up to 5).
      - name: Reset
        run: |
          start=$(date +%s)
          dotnet run lab.cs -- reset
          took=$(( $(date +%s) - start ))
          echo "reset took $took s"
          if [ "$took" -gt 300 ]; then echo "::error::reset took $took s; M2 asks for under 3 minutes."; exit 1; fi
          if [ "$took" -gt 180 ]; then echo "::warning::reset took $took s; M2 asks for under 3 minutes."; fi

      # ...and `down` leaves nothing behind: no cluster, no node container.
      - name: Down
        run: |
          dotnet run lab.cs -- down
          if .tools/bin/kind get clusters 2>/dev/null | grep -qx eventticketing; then echo "::error::The cluster is still there."; exit 1; fi
          left="$(docker ps -a --filter label=io.x-k8s.kind.cluster=eventticketing -q)"
          if [ -n "$left" ]; then echo "::error::Containers are left: $left"; exit 1; fi

      - name: What ran (on failure)
        if: failure()
        run: |
          kubectl=.tools/bin/kubectl
          $kubectl --context kind-eventticketing get pods --all-namespaces -o wide || true
          $kubectl --context kind-eventticketing get events --all-namespaces --sort-by=.lastTimestamp | tail -40 || true
          for deployment in publicapi workers webhookingress backofficeapi fansite; do
            echo "== $deployment"
            $kubectl --context kind-eventticketing logs -n eventticketing "deployment/$deployment" --tail=60 || true
          done
          $kubectl --context kind-eventticketing logs -n eventticketing job/migrator --tail=60 || true
