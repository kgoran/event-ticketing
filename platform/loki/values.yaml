# Loki for the lab (D55): one binary, its files on the pod, no caches or canaries. Logs arrive from
# the collector over OTLP. In zone-a (D59).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - { from: "2026-01-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: index_, period: 24h } }
  limits_config:
    allow_structured_metadata: true
    retention_period: 6h
  pattern_ingester: { enabled: false }
singleBinary:
  replicas: 1
  nodeSelector: { topology.kubernetes.io/zone: zone-a }
  persistence: { enabled: false }
  extraVolumes: [{ name: data, emptyDir: {} }]
  extraVolumeMounts: [{ name: data, mountPath: /var/loki }]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
