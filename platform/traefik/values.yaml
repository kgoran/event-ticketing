# Traefik for the lab (ADR-0028, ADR-0053): Gateway API routes only, and one listener per usual
# localhost port. The cluster maps each host port to the NodePort below (platform/kind/cluster.yaml);
# inside the cluster, clients that stand in for the outside world use the same ports on the
# `traefik` service, so their requests are balanced across instances one by one.
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false

service:
  type: NodePort

ports:
  web:
    expose:
      default: false
  websecure:
    expose:
      default: false
  fansite: { port: 5100, exposedPort: 5100, nodePort: 30100, protocol: TCP, expose: { default: true } }
  publicapi: { port: 5101, exposedPort: 5101, nodePort: 30101, protocol: TCP, expose: { default: true } }
  backofficeapi: { port: 5102, exposedPort: 5102, nodePort: 30102, protocol: TCP, expose: { default: true } }
  webhookingress: { port: 5103, exposedPort: 5103, nodePort: 30103, protocol: TCP, expose: { default: true } }
  localpay: { port: 5201, exposedPort: 5201, nodePort: 30201, protocol: TCP, expose: { default: true } }
  scalinglab: { port: 5300, exposedPort: 5300, nodePort: 30300, protocol: TCP, expose: { default: true } }
  loadgenerator: { port: 5301, exposedPort: 5301, nodePort: 30301, protocol: TCP, expose: { default: true } }
  mailpit: { port: 8025, exposedPort: 8025, nodePort: 30025, protocol: TCP, expose: { default: true } }
  keycloak: { port: 8180, exposedPort: 8180, nodePort: 30180, protocol: TCP, expose: { default: true } }
  dashboard: { port: 18888, exposedPort: 18888, nodePort: 30888, protocol: TCP, expose: { default: true } }

# One Gateway, `lab` in namespace platform; routes from any namespace attach to a listener by name.
gateway:
  name: lab
  listeners:
    web: null
    fansite: { port: 5100, protocol: HTTP, namespacePolicy: { from: All } }
    publicapi: { port: 5101, protocol: HTTP, namespacePolicy: { from: All } }
    backofficeapi: { port: 5102, protocol: HTTP, namespacePolicy: { from: All } }
    webhookingress: { port: 5103, protocol: HTTP, namespacePolicy: { from: All } }
    localpay: { port: 5201, protocol: HTTP, namespacePolicy: { from: All } }
    scalinglab: { port: 5300, protocol: HTTP, namespacePolicy: { from: All } }
    loadgenerator: { port: 5301, protocol: HTTP, namespacePolicy: { from: All } }
    mailpit: { port: 8025, protocol: HTTP, namespacePolicy: { from: All } }
    keycloak: { port: 8180, protocol: HTTP, namespacePolicy: { from: All } }
    dashboard: { port: 18888, protocol: HTTP, namespacePolicy: { from: All } }
