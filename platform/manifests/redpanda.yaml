# Redpanda for the lab (D76, ADR-0057): three brokers, one per zone, so the zone drill loses one.
# Redpanda replicates each partition by Raft: a write with acks=all returns once a majority (two of
# three) has it, and a partition whose leader's zone goes elects another leader. Plain text inside
# the cluster; nothing outside it reaches the brokers but Redpanda Console, through the gateway.
# Cluster properties, read once when the cluster first starts. Topics are created by the Migrator
# with their settings (KF1), never by a typo: `--overprovisioned` would otherwise let any producer
# create one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-bootstrap
  namespace: platform
data:
  .bootstrap.yaml: |
    auto_create_topics_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: platform
  labels:
    app.kubernetes.io/name: redpanda
spec:
  # Headless: each broker has its own name (redpanda-0.redpanda…), and the seeds find each other
  # before they are ready.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    - { name: admin, port: 9644, targetPort: admin }
    - { name: rpc, port: 33145, targetPort: rpc }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: platform
  labels:
    app.kubernetes.io/name: redpanda
spec:
  serviceName: redpanda
  replicas: 3
  # The seeds form the cluster together: all three start at once.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      # One broker per node, so one per zone.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: redpanda
              topologyKey: topology.kubernetes.io/zone
      # A lost zone's broker is given up on after 30 s, as the hosts are (D59).
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      terminationGracePeriodSeconds: 60
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          args:
            - redpanda
            - start
            # One core and 768 MB each: enough for the lab, and it shares the laptop. Overprovisioned
            # also skips fsync: a broker survives its pod being killed, not the laptop losing power.
            - --smp=1
            - --memory=768M
            - --reserve-memory=0M
            - --overprovisioned
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://$(POD_NAME).redpanda.platform.svc.cluster.local:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=$(POD_NAME).redpanda.platform.svc.cluster.local:33145
            - --seeds=redpanda-0.redpanda.platform.svc.cluster.local:33145,redpanda-1.redpanda.platform.svc.cluster.local:33145,redpanda-2.redpanda.platform.svc.cluster.local:33145
            - --default-log-level=warn
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: admin, containerPort: 9644 }
            - { name: rpc, containerPort: 33145 }
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 900Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
            - { name: bootstrap, mountPath: /etc/redpanda/.bootstrap.yaml, subPath: .bootstrap.yaml }
      volumes:
        - name: bootstrap
          configMap: { name: redpanda-bootstrap }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
# A drain or an upgrade takes one broker at a time: two keep the majority.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redpanda
  namespace: platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
---
# Redpanda Console: topics, partitions and their leaders, messages, consumer groups and their lag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: platform
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-console
    spec:
      # With the lab's outside world, in zone-a (D59).
      nodeSelector: { topology.kubernetes.io/zone: zone-a }
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.12.0
          env:
            - { name: KAFKA_BROKERS, value: "redpanda-0.redpanda.platform.svc.cluster.local:9092,redpanda-1.redpanda.platform.svc.cluster.local:9092,redpanda-2.redpanda.platform.svc.cluster.local:9092" }
            - { name: REDPANDA_ADMINAPI_ENABLED, value: "true" }
            - { name: REDPANDA_ADMINAPI_URLS, value: "http://redpanda-0.redpanda.platform.svc.cluster.local:9644,http://redpanda-1.redpanda.platform.svc.cluster.local:9644,http://redpanda-2.redpanda.platform.svc.cluster.local:9644" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /admin/health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: redpanda-console
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Redpanda Console on 8088, as under Aspire (ADR-0053).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redpanda-console
  namespace: platform
spec:
  parentRefs:
    - { name: lab, namespace: platform, sectionName: redpandaconsole }
  rules:
    - backendRefs:
        - { name: redpanda-console, port: 8080 }
