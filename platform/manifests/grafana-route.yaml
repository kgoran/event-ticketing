# Grafana on its usual port, 3000, through the gateway (ADR-0053).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: platform
spec:
  parentRefs:
    - { name: lab, namespace: platform, sectionName: grafana }
  rules:
    - backendRefs:
        - { name: grafana, port: 80 }
