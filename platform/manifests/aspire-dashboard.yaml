# The Aspire Dashboard as the lab's telemetry sink (ADR-0053, D27): every pod sends traces, logs and
# metrics over OTLP; the dashboard at http://localhost:18888 shows each instance as its own replica.
# In memory only: the lab is disposable. Unsecured, because it listens only on 127.0.0.1.
# Prometheus, Grafana, Loki and Tempo come in M3 with the service dashboards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
  namespace: platform
  labels:
    app.kubernetes.io/name: aspire-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aspire-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aspire-dashboard
    spec:
      # The lab's outside world lives in zone-a, the way in, which no drill stops (D59).
      nodeSelector: { topology.kubernetes.io/zone: zone-a }
      containers:
        - name: dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
          env:
            - { name: ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS, value: "true" }
            - { name: DASHBOARD__APPLICATIONNAME, value: "EventTicketing lab" }
          ports:
            - { name: ui, containerPort: 18888 }
            - { name: otlp-grpc, containerPort: 18889 }
            - { name: otlp-http, containerPort: 18890 }
          readinessProbe:
            tcpSocket: { port: ui }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: aspire-dashboard
  ports:
    - { name: ui, port: 18888, targetPort: ui }
    - { name: otlp-grpc, port: 18889, targetPort: otlp-grpc }
    - { name: otlp-http, port: 18890, targetPort: otlp-http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aspire-dashboard
  namespace: platform
spec:
  parentRefs:
    - { name: lab, namespace: platform, sectionName: dashboard }
  rules:
    - backendRefs:
        - { name: aspire-dashboard, port: 18888 }
