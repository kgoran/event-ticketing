# Keycloak for the lab (ADR-0027, ADR-0053): dev mode, the realm Aspire imports too
# (dev/AppHost/Realms, put in the keycloak-realm ConfigMap by lab.cs), imported at every start.
# Every token names http://localhost:8180 as its issuer, whoever asks for it. Services reach
# Keycloak by its internal name, and its back-channel endpoints follow that address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
      annotations:
        # Filled in by lab.cs: Keycloak imports the realm only when it starts, so a changed realm
        # file changes this value and restarts it.
        lab.eventticketing/realm: "REALM_HASH"
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6
          args: [start-dev, --import-realm]
          env:
            - { name: KC_HOSTNAME, value: "http://localhost:8180" }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: lab-secrets, key: keycloak-admin-password } }
            # The realm file's placeholders, as under Aspire.
            - { name: FANSITE_URL, value: "http://localhost:5100" }
            - name: FANSITE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: lab-secrets, key: fansite-client-secret } }
            - name: ORGANIZERS_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: lab-secrets, key: organizers-client-secret } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: platform
spec:
  parentRefs:
    - { name: lab, namespace: platform, sectionName: keycloak }
  rules:
    - backendRefs:
        - { name: keycloak, port: 8080 }
