# SeaweedFS for the lab (D65): the object store CloudNativePG's backups go to, over S3. One process
# (master, volume, filer and the S3 gateway), its data on a persistent volume: a backup has to
# outlive the database it saves. In zone-a with the rest of the lab's outside world (D59). Its S3
# credentials are the Secret seaweedfs-s3, which lab.cs writes from the lab's secrets.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: platform
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      nodeSelector: { topology.kubernetes.io/zone: zone-a }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=1024
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: master, containerPort: 9333 }
            - { name: filer, containerPort: 8888 }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: seaweedfs }
        - name: s3-config
          secret: { secretName: seaweedfs-s3 }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
    - { name: master, port: 9333, targetPort: master }
    - { name: filer, port: 8888, targetPort: filer }
