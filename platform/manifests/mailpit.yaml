# Mailpit for the lab (ADR-0052): catches every email; inbox at http://localhost:8025.
# The same image as under Aspire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: platform
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.3
          ports:
            - { name: http, containerPort: 8025 }
            - { name: smtp, containerPort: 1025 }
          readinessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - { name: http, port: 8025, targetPort: http }
    - { name: smtp, port: 1025, targetPort: smtp }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mailpit
  namespace: platform
spec:
  parentRefs:
    - { name: lab, namespace: platform, sectionName: mailpit }
  rules:
    - backendRefs:
        - { name: mailpit, port: 8025 }
