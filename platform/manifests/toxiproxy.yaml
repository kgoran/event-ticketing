# Toxiproxy for the lab (D57): between the hosts and PgBouncer, passing everything through until a
# toxic is added (the Scaling Lab's slow database scenario). Its API at :8474 is the lab's only:
# nothing outside the cluster reaches it. A restart forgets every toxic, so the database is never
# left slow by accident. In zone-a with the rest of the lab's outside world (D59).
apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy
  namespace: platform
data:
  toxiproxy.json: |
    [
      {
        "name": "database",
        "listen": "0.0.0.0:5432",
        "upstream": "eventticketing-pooler-rw.eventticketing.svc.cluster.local:5432",
        "enabled": true
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: platform
  labels:
    app.kubernetes.io/name: toxiproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toxiproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toxiproxy
    spec:
      nodeSelector: { topology.kubernetes.io/zone: zone-a }
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.12.0
          args: [-host=0.0.0.0, -config=/config/toxiproxy.json]
          ports:
            - { name: api, containerPort: 8474 }
            - { name: database, containerPort: 5432 }
          readinessProbe:
            httpGet: { path: /version, port: api }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - name: config
          configMap: { name: toxiproxy }
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: toxiproxy
  ports:
    - { name: api, port: 8474, targetPort: api }
    - { name: database, port: 5432, targetPort: database }
