# Defaults for any environment. values-lab.yaml holds the lab's addresses and instance counts.

image:
  # Images are named eventticketing/<host> (ADR-0029); all hosts of a release share one tag.
  repository: eventticketing
  tag: latest
  pullPolicy: IfNotPresent

# The CloudNativePG cluster from product/deploy/database: its Service <cluster>-rw and Secret <cluster>-app.
database:
  cluster: eventticketing
  # Connections each instance may hold (Npgsql's default is 100). With the lab's caps, at most
  # 8 PublicApi + 2 Workers + 2 WebhookIngress + 1 BackOfficeApi + the Migrator = 14 pools of 20 =
  # 280, within the database's 300 (product/deploy/database).
  maxPoolSize: 20
  # Where the hosts reach PgBouncer: empty is its own Service, <cluster>-pooler-rw.
  poolerHost: ""

# OpenTelemetry collector the hosts export to (ServiceDefaults): empty sends nothing. Prometheus,
# where an autoscaler reads what the hosts measure (D56).
telemetry:
  otlpEndpoint: ""
  prometheus: ""

# Keycloak's realm as the hosts reach it; tokens carry its public issuer (ADR-0053).
identity:
  authority: ""
  requireHttpsMetadata: true

# Addresses the hosts need.
urls:
  # The fan site's public address: sign-in redirects, the return page after paying, links in emails.
  fanSite: ""
  # LocalPay's API (payments) and Keycloak's base address (Organizers keeps its groups in step).
  localPay: ""
  keycloak: ""
  smtpHost: ""
  smtpPort: 1025

# The Secret with client secrets, the webhook secret and the ticketing master key (D33).
secrets:
  name: lab-secrets

# Every host of the product. `route` names the gateway listener that serves it; `database` gives it
# the connection string.
hosts:
  publicapi: { replicas: 1, route: publicapi, database: true }
  backofficeapi: { replicas: 1, route: backofficeapi, database: true }
  webhookingress: { replicas: 1, route: webhookingress, database: true }
  workers: { replicas: 1, database: true }
  fansite: { replicas: 1, route: fansite }

gateway:
  name: lab
  namespace: platform

# Settings every host gets, as environment variables (configuration, never code: ADR-0018).
env: {}

resources:
  requests: { cpu: 50m, memory: 160Mi }
  limits: { memory: 512Mi }

# Feature flags at the first install (FF1, docs/feature-flags.md); after that, `lab flag` switches
# them in the running system, and a deploy keeps them.
features:
  # An operator's brake: refuse new holds with 503 and Retry-After (D45).
  PauseHolds: false

# Valkey (D51): the shared output cache. Its connection string's options make an outage quick to
# notice: the hosts don't wait to connect at startup, and a call gives up after half a second.
valkey:
  image: valkey/valkey:8.1
  maxMemory: 256mb
  connectionString: valkey:6379,abortConnect=false,connectTimeout=2000,syncTimeout=500,asyncTimeout=500
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 320Mi }

# The product's Grafana dashboards (D55), from dashboards/: ConfigMaps for Grafana's sidecar.
dashboards:
  enabled: true
