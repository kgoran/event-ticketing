{{/*
Valkey (D51, ADR-0055): one instance, never authoritative. Browsing's output cache lives here, so
losing it costs cache misses and nothing else; the hosts treat an outage as a miss. Its files are
on an emptyDir: they survive a restart of the container, not a move to another node, which a zone
failure causes. Capped, evicting the least recently used keys first.
*/}}
{{- with .Values.valkey }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      # Replaced 30 s after its node is lost, like the hosts (D59).
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: valkey
          image: {{ .image }}
          args: [--appendonly, "yes", --save, "", --maxmemory, {{ .maxMemory | quote }}, --maxmemory-policy, allkeys-lru]
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            tcpSocket: { port: valkey }
            periodSeconds: 5
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
{{- end }}
