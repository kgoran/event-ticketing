{{/*
Autoscaling (ADR-0054): a KEDA ScaledObject for each host with `autoscaling` in the values. KEDA's
`paused` annotation switches it off; then the count is whoever sets the Deployment's scale (the
Scaling Lab's − and +). Both the switch and the scale-down wait belong to whoever operates the
lab once installed, so a deploy renders what runs, and the values only at the first install.
*/}}
{{- range $name, $host := .Values.hosts }}
{{- with $host.autoscaling }}
{{- if not ($.Capabilities.APIVersions.Has "keda.sh/v1alpha1/ScaledObject") }}
{{- fail (printf "%s autoscales, which needs KEDA in the cluster (ADR-0054)" $name) }}
{{- end }}
{{- if not $.Values.telemetry.prometheus }}
{{- fail (printf "%s autoscales on what Prometheus measures: set telemetry.prometheus (D56)" $name) }}
{{- end }}
{{- $context := dict "name" $name "root" $ }}
{{- $running := lookup "keda.sh/v1alpha1" "ScaledObject" $.Release.Namespace $name }}
{{- $paused := .pausedAtInstall }}
{{- $scaleDown := .scaleDownSeconds }}
{{- if $running }}
{{- $paused = eq (dig "metadata" "annotations" "autoscaling.keda.sh/paused" "false" $running) "true" }}
{{- $scaleDown = dig "spec" "advanced" "horizontalPodAutoscalerConfig" "behavior" "scaleDown" "stabilizationWindowSeconds" $scaleDown $running }}
{{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventticketing.labels" $context | nindent 4 }}
  {{- if $paused }}
  annotations:
    autoscaling.keda.sh/paused: "true"
  {{- end }}
spec:
  scaleTargetRef:
    name: {{ $name }}
  # Every autoscaled host has a maximum (ADR-0019): the database's connection budget.
  minReplicaCount: {{ .minReplicas }}
  maxReplicaCount: {{ .maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Scales up only to the lowest count wanted over this window: a new instance's first
        # moments under load cost extra CPU, and shouldn't buy yet another instance (D43).
        scaleUp:
          stabilizationWindowSeconds: {{ .scaleUpSeconds }}
        scaleDown:
          stabilizationWindowSeconds: {{ int $scaleDown }}
  triggers:
    # Requests in progress (ADR-0019, D56): the seconds of request time the host spends per
    # second, all instances together, over half a minute. That is the average number of requests in
    # progress (Little's law: arrivals per second × seconds each takes), without sampling a gauge.
    # Kubernetes wants ⌈ that ÷ the target per instance ⌉ instances. Probes aren't traffic, nor is
    # an instance's warm-up (ServiceDefaults leaves it out of the metrics).
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: {{ $.Values.telemetry.prometheus | quote }}
        query: >-
          sum(rate(http_server_request_duration_seconds_sum{job="{{ $name }}", http_route!~"/health|/alive"}[30s]))
        threshold: {{ .inProgressPerInstance | quote }}
{{- end }}
{{- end }}
