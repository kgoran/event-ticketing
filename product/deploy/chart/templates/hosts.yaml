{{- range $name, $host := .Values.hosts }}
{{- $context := dict "name" $name "root" $ "database" $host.database }}
{{- $running := lookup "apps/v1" "Deployment" $.Release.Namespace $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventticketing.labels" $context | nindent 4 }}
spec:
  # The instance count from values at the first install; after that, the count that runs. Someone may
  # have changed it (the Scaling Lab, M5's autoscaler), and a deploy shouldn't undo that.
  replicas: {{ if $running }}{{ $running.spec.replicas }}{{ else }}{{ $host.replicas }}{{ end }}
  # A rollout (DP2, T10) starts one new instance at a time and stops an old one only once the new
  # one is ready: never fewer ready instances than wanted, so a deploy under load fails nothing.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "eventticketing.selector" $context | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventticketing.labels" $context | nindent 8 }}
    spec:
      {{- include "eventticketing.podSecurity" $context | nindent 6 }}
      # A host's instances spread over the zones, and over nodes (D47), as a preference: when a zone
      # is lost, its replacements must still start in the others. Counted per rollout's revision.
      topologySpreadConstraints:
        {{- range list "topology.kubernetes.io/zone" "kubernetes.io/hostname" }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "eventticketing.selector" $context | nindent 14 }}
          matchLabelKeys: [pod-template-hash]
        {{- end }}
      # A lost node's instances are replaced after 30 s, not Kubernetes' default 5 minutes (D59).
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      # A stopping instance first waits (preStop), then finishes its requests on SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: {{ include "eventticketing.image" $context }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "eventticketing.commonEnv" $context | nindent 12 }}
            {{- include "eventticketing.hostEnv" $context | nindent 12 }}
          # /alive: the process works; /health: every check passes, so it may take traffic (ServiceDefaults).
          # Kubernetes' default 1 s timeout is too short under load: /health checks the database, and a
          # check that times out takes a healthy instance out of rotation, which loads the others more.
          startupProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          # When an instance stops, the gateway takes a moment to learn it: keep answering until it has.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            {{- toYaml ($host.resources | default $.Values.resources) | nindent 12 }}
          {{- include "eventticketing.containerSecurity" $context | nindent 10 }}
      {{- include "eventticketing.scratchVolumes" $context | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventticketing.labels" $context | nindent 4 }}
spec:
  selector:
    {{- include "eventticketing.selector" $context | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if $host.route }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventticketing.labels" $context | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $host.route }}
  rules:
    - backendRefs:
        - { name: {{ $name }}, port: 8080 }
{{- end }}
{{- end }}
