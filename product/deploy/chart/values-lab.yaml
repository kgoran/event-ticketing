# The lab (ADR-0053): images loaded into the kind cluster, the platform's internal addresses, the
# public ones on localhost, and several instances of the stateless hosts (D30).

image:
  # Loaded by `kind load`; a missing image should fail loudly, not be looked for in a registry.
  pullPolicy: Never

# PgBouncer through Toxiproxy (D57), which passes everything until the Scaling Lab slows it.
database:
  poolerHost: toxiproxy.platform.svc.cluster.local

telemetry:
  otlpEndpoint: http://opentelemetry-collector.platform.svc.cluster.local:4317
  prometheus: http://prometheus-server.platform.svc.cluster.local

identity:
  authority: http://keycloak.platform.svc.cluster.local:8080/realms/eventticketing
  requireHttpsMetadata: false

urls:
  fanSite: http://localhost:5100
  localPay: http://localpay.lab.svc.cluster.local:8080
  keycloak: http://keycloak.platform.svc.cluster.local:8080
  smtpHost: mailpit.platform.svc.cluster.local

hosts:
  publicapi:
    replicas: 3
    # No CPU limit (D69): under a limit below a core .NET sees one processor, and a burst on a new
    # instance starved its thread pool for a minute (measured 2026-10-22, docs/lab.md).
    resources:
      requests: { cpu: 150m, memory: 160Mi }
      limits: { memory: 512Mi }
    # The Scaling Lab's Auto switch (ADR-0054): off after `lab up`, 1 to 8 instances, demo speed.
    # The target, in requests in progress per instance (D56, D69): 0.5 is what each of three
    # instances had at 50 requests/s of the default mix (measured 2026-10-22). The instances share
    # one laptop, which carries about 400 requests/s: 50 each lets the maximum of 8 fit it.
    autoscaling:
      pausedAtInstall: true
      minReplicas: 1
      maxReplicas: 8
      inProgressPerInstance: 0.5
      scaleUpSeconds: 20
      scaleDownSeconds: 30
  webhookingress: { replicas: 2 }
  # Two Workers compete for the outbox and the schedule; rows are claimed with SKIP LOCKED (ADR-0014).
  workers: { replicas: 2 }
  # Two, now that fans' tokens and the cookie's keys are in Valkey (D54).
  fansite: { replicas: 2 }

env:
  # Every SQL command at Information is a lot of logging under load.
  Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
  # No dynamic PGO (D43): it recompiles every busy method once more in the background, so a new
  # instance used about four times its usual CPU for its first half-minute of traffic, which the
  # CPU autoscaler took for load. Measured in the lab: the spike went from 621m to 224m, and the
  # steady CPU didn't change (about 5m per request/s). Worth revisiting on utilization (M3).
  DOTNET_TieredPGO: "0"
