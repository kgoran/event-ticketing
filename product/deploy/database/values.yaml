# Three instances, one per zone (D48, ADR-0055): the primary and two standbys. Every commit waits
# for one of the standbys, so losing a zone loses nothing; the other standby serves reads.
name: eventticketing
instances: 3
# The same PostgreSQL version as under Aspire.
image: ghcr.io/cloudnative-pg/postgresql:18.3-minimal-trixie
storage: 2Gi
# The connection budget. Since M3 the hosts' pools end at PgBouncer (below), which holds at most
# 2 × 40 connections to the primary; the Migrator, the replicas' readers and the lab's checks connect
# directly. 300 leaves room for all of it.
maxConnections: 300

# PgBouncer (D49): two instances, each with up to 40 connections to the primary for the app's user.
pooler:
  instances: 2
  poolSize: 40
  maxClientConnections: 1000
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

# Backups (D65): base backups and WAL through CloudNativePG's Barman Cloud plugin to an S3 object
# store. Off unless an environment names one (values-lab.yaml: SeaweedFS).
backups:
  enabled: false
  # A base backup a day at 03:00 (seconds first, CloudNativePG's cron), and one at once when it is
  # set up, so there is always one to restore from; WAL in between, every 5 minutes at the latest.
  schedule: "0 0 3 * * *"
  retention: 7d
  destinationPath: ""
  endpointURL: ""
  # The Secret with the store's keys: backup-access-key and backup-secret-key.
  secret: ""
